[package]
name = "gthings-serve"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gthings HTTP :9080 daemon: search (simple/parallel/harvest) and extract/ax/pdf-url/pdf-file jobs through a bounded queue, SSE streaming, and graceful shutdown"

[dependencies]
axum = "0.8"
futures = "0.3"
gthings-cdp = { path = "../cdp", version = "0.5.5" }
gthings-common = { path = "../common", version = "0.3.8" }
gthings-extraction = { path = "../extraction", version = "0.5.4" }
gthings-search = { path = "../search", version = "0.8.0" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
