[package]
name = "gthings-cdp"
version = "0.5.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chrome DevTools Protocol transport — WebSocket connection, tab management, and browser lifecycle"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "net", "rt", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
gthings-common = { path = "../common", version = "0.3.5" }

[lints]
workspace = true
