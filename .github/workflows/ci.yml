name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt + clippy + build + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  package:
    name: crates.io package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify packages (dry-run)
        run: |
          set -euo pipefail
          for crate in crates/*/; do
            pkg=$(grep -m1 '^name' "$crate/Cargo.toml" | sed 's/name *= *"\(.*\)"/\1/')
            echo "Verifying package: $pkg"
            cargo package -p "$pkg" --list > /dev/null
          done

  release:
    name: publish crate + docker image (tag-driven)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: gthings-prod
    needs: [check, package]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Publish tagged crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${TAG_REF#refs/tags/}"
          pkg="${tag%%/*}"
          case "$pkg" in
            gthings) dir="cli" ;;
            gthings-*) dir="${pkg#gthings-}" ;;
            *) echo "unknown tag format: $tag"; exit 1 ;;
          esac
          ver="v$(grep -m1 '^version' "crates/$dir/Cargo.toml" | sed 's/.*"\(.*\)"/\1/')"
          if [ "$ver" != "${tag#*/}" ]; then
            echo "tag ${tag#*/} does not match manifest version $ver"; exit 1
          fi
          echo "Publishing $pkg $ver"
          cargo publish -p "$pkg"
      - name: Docker login
        if: startsWith(github.ref, 'refs/tags/gthings-serve/')
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - name: Build and push docker image
        if: startsWith(github.ref, 'refs/tags/gthings-serve/')
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' crates/serve/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          docker build -t "$DOCKER_USERNAME/gthings:$ver" .
          docker push "$DOCKER_USERNAME/gthings:$ver"
